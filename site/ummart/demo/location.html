    /* ---- serve GET api/* from the snapshot, neutralise writes ---- */
    function fixtureName(url) {
      // ../api/public/get_products.php?x=1  ->  api/public/get_products.php
      var m = String(url).match(/api\/[A-Za-z0-9_\/.\-]+\.php/);
      return m ? m[0] : null;
    }
    var _fetch = window.fetch;
    window.fetch = function (url, opts) {
      var name = fixtureName(url);
      if (!name) return _fetch.apply(this, arguments);
      var method = ((opts && opts.method) || 'GET').toUpperCase();
      if (method !== 'GET') {
        console.info('[FilesXins demo] write call skipped:', name);
        return Promise.resolve(new Response(JSON.stringify({
          success: false, demo: true, message: NOTE
        }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      // GET -> the snapshot file (stored as .json, so parse it ourselves).
      // Keep the original ../ prefix so it resolves exactly like the .php call did.
      var target = String(url).replace(/\.php(\?[^#]*)?$/, '.json');
      return _fetch(target, { cache: 'force-cache' })
        .then(function (r) { return r.text(); })
        .then(function (t) { return new Response(t, { status: 200, headers: { 'Content-Type': 'application/json' } }); })
        .catch(function () {
          return new Response(JSON.stringify({ success: false, demo: true, message: NOTE }),
            { status: 200, headers: { 'Content-Type': 'application/json' } });
        });
    };

    /* ---- neutralise XHR writes too ---- */
    var _open = XMLHttpRequest.prototype.open, _send = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (m, u) {
      this.__fx = m && String(m).toUpperCase() !== 'GET' && String(u).indexOf('api/') !== -1;
      return _open.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () { if (this.__fx) return; return _send.apply(this, arguments); };

    <p>Click the button below to get your current location. We will use this information to customize your shopping experience.</p>

  <script>
function openMaps() {
    // Memeriksa apakah browser mendukung Geolocation API
    if (navigator.geolocation) {
        // Mendapatkan posisi pengguna saat ini
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // Membuat URL Google Maps dengan koordinat pengguna
                const mapsUrl = `https://www.google.com/maps/@${lat},${lon},15z`;
                window.open(mapsUrl, '_blank'); // Buka di tab baru
                
                // Mendapatkan nama kota dari koordinat menggunakan reverse geocoding
                getCityName(lat, lon);
            },
            function(error) {
                console.error("Geolocation error:", error);
                
                let errorMessage;
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage = "Anda menolak permintaan lokasi. Aktifkan layanan lokasi pada browser atau perangkat Anda.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage = "Informasi lokasi tidak tersedia saat ini.";
                        break;
                    case error.TIMEOUT:
                        errorMessage = "Permintaan untuk mendapatkan lokasi melebihi batas waktu.";
                        break;
                    default:
                        errorMessage = "Terjadi kesalahan saat mencoba mendapatkan lokasi Anda.";
                        break;
                }
                UINotification.show(errorMessage);
            }
        );
    } else {
        // Jika browser tidak mendukung Geolocation
        UINotification.show('Browser Anda tidak mendukung fitur lokasi.');
    }
}

// Fungsi untuk mendapatkan nama kota dari koordinat
function getCityName(lat, lon) {
    // Menggunakan Nominatim API untuk reverse geocoding
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            let cityName = "Lokasi Anda";
            
            // Mencari nama kota dari hasil response
            if (data.address) {
                if (data.address.city) {
                    cityName = data.address.city;
                } else if (data.address.town) {
                    cityName = data.address.town;
                } else if (data.address.village) {
                    cityName = data.address.village;
                } else if (data.address.municipality) {
                    cityName = data.address.municipality;
                } else if (data.address.county) {
                    cityName = data.address.county;
                } else if (data.address.state) {
                    cityName = data.address.state;
                }
            }
            
            // Menyimpan nama kota di localStorage
            localStorage.setItem('userLocation', cityName);
            
            // Beri tahu pengguna bahwa proses berhasil
            UINotification.show(`Lokasi Anda telah terdeteksi: ${cityName}. Silakan kembali ke halaman utama untuk melihat perubahannya.`);
        })
        .catch(error => {
            console.error("Error getting city name:", error);
            // Jika gagal mendapatkan nama kota, simpan koordinat sebagai fallback
            localStorage.setItem('userLocation', 'Lokasi Anda Terdeteksi');
            UINotification.show('Lokasi Anda telah terdeteksi. Silakan kembali ke halaman utama untuk melihat perubahannya.');
        });
}
  </script>
